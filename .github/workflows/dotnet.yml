name: .NET

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TempleOfDoom.sln

      - name: Build
        run: dotnet build TempleOfDoom.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TempleOfDoom.sln --configuration Release --no-build --verbosity normal
